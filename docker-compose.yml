services:
  postgres:
    image: postgres:16-alpine
    container_name: ums-payments-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ums
      POSTGRES_PASSWORD: ums
      POSTGRES_DB: ums_payments
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ums -d ums_payments']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
